name: Build Fedora DDE Live ISO

on:
  push:
    branches: [main, iso-candidate-20261127.1]
    paths-ignore:
      - '*.md'
      - LICENSE
      - '.github/workflows/test-install.yml'
      - '.github/workflows/diagnose-dpf.yml'
      - '.github/workflows/build-dfm-hotfix.yml'
      - '.github/workflows/validate-dfm-hotfix.yml'
      - 'scripts/diagnose-dpf/**'
      - 'scripts/build-dfm-hotfix.sh'
      - 'scripts/validate-dfm-hotfix.*'
      - 'packaging/hotfix/**'
      - 'scripts/test-install-vm.py'
      - 'scripts/vm-*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  compose:
    name: Fedora 45 x86_64 Live ISO (SELinux Enforcing)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      iso-artifact: ${{ steps.recipe.outputs.iso_artifact }}
    steps:
      - name: Check out ISO recipe
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read pinned installer revision
        id: recipe
        shell: bash
        run: |
          set -euo pipefail
          source config/build.env
          [[ $INSTALLER_REF =~ ^[0-9a-f]{40}$ ]]
          echo "installer_ref=$INSTALLER_REF" >> "$GITHUB_OUTPUT"
          echo "iso_artifact=Fedora-DDE-Remix-$CONFIG_VERSION-x86_64-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned installer
        uses: actions/checkout@v4
        with:
          repository: Fedora-DDE-Remix/fedora-dde-installer
          ref: ${{ steps.recipe.outputs.installer_ref }}
          path: .build/installer
          persist-credentials: false

      - name: Prepare build directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs "$RUNNER_TEMP/fedora-dde-iso-work"
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          sudo modprobe loop
          sudo modprobe dm_mod
          sudo modprobe squashfs
          sudo losetup --find
          docker pull registry.fedoraproject.org/fedora:45
          docker image inspect registry.fedoraproject.org/fedora:45 \
            --format '{{json .RepoDigests}}' > artifacts/container-image.json

      - name: Reuse the verified installer CI artifact when available
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .build/installer-rpms
          source config/build.env
          if [[ $INSTALLER_REF != f9fb0061d596e53621b7c8daac8fc0cd77257594 ]]; then
            echo 'No verified artifact is pinned for this installer revision; building from source.'
            exit 0
          fi
          if ! artifact_source_ref=$(gh api repos/Fedora-DDE-Remix/fedora-dde-installer/actions/runs/45950570144 --jq .head_sha); then
            echo 'Installer CI metadata is unavailable; building from source.'
            exit 0
          fi
          if [[ $artifact_source_ref != "$INSTALLER_REF" ]]; then
            echo 'Installer CI revision differs; building from source.'
            exit 0
          fi
          if ! gh api repos/Fedora-DDE-Remix/fedora-dde-installer/actions/artifacts/15176607519/zip > .build/installer-input.zip; then
            echo 'Installer artifact is unavailable or expired; building from source.'
            exit 0
          fi
          echo 'bc86b56129d3c847ac9bfd633155412662f6226ae5be84034c0d06b7d15bd416  .build/installer-input.zip' | sha256sum --check --strict
          unzip -q .build/installer-input.zip -d .build/installer-rpms
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = {'schema': 1, 'commit': 'f9fb0061d596e53621b7c8daac8fc0cd77257594',
                  'run_id': 45950570144, 'artifact_id': 15176607519,
                  'sha256': 'bc86b56129d3c847ac9bfd633155412662f6226ae5be84034c0d06b7d15bd416'}
          Path('.build/installer-rpms/verified-input.json').write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Download the pinned complete DFM hotfix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          expected = json.loads(Path('config/dfm-hotfix-input.json').read_text())
          repository = 'Fedora-DDE-Remix/ISO-Build'
          assert type(expected['schema']) is int and expected['schema'] in (1, 2) and expected['repository'] == repository
          assert re.fullmatch(r'[0-9a-f]{40}', expected['build_commit'])
          assert re.fullmatch(r'[0-9a-f]{64}', expected['sha256'])
          assert type(expected['run_id']) is int and expected['run_id'] > 0
          assert type(expected['artifact_id']) is int and expected['artifact_id'] > 0
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repository + path], text=True))
          verification_run = expected['run_id']
          verification_commit = expected['build_commit']
          if expected['schema'] == 2:
              verification_run = expected['validation_run_id']
              verification_commit = expected['validation_commit']
              assert type(verification_run) is int and verification_run > 0
              assert re.fullmatch(r'[0-9a-f]{40}', verification_commit)
              original = expected['source_artifact']
              assert set(original) == {'id', 'sha256', 'size_in_bytes'}
              assert type(original['id']) is int and original['id'] > 0
              assert type(original['size_in_bytes']) is int and original['size_in_bytes'] > 0
              assert re.fullmatch(r'[0-9a-f]{64}', original['sha256'])
              original_run = api('/actions/runs/' + str(expected['run_id']))
              assert original_run['head_sha'] == expected['build_commit'] and original_run['conclusion'] == 'failure'
              original_artifact = api('/actions/artifacts/' + str(original['id']))
              assert original_artifact['workflow_run']['id'] == expected['run_id']
              assert original_artifact['workflow_run']['head_sha'] == expected['build_commit']
              assert original_artifact['size_in_bytes'] == original['size_in_bytes']
              assert original_artifact['digest'] == 'sha256:' + original['sha256']
          run = api('/actions/runs/' + str(verification_run))
          assert run['head_sha'] == verification_commit and run['conclusion'] == 'success'
          artifact = api('/actions/artifacts/' + str(expected['artifact_id']))
          assert artifact['workflow_run']['id'] == verification_run and not artifact['expired']
          assert artifact['workflow_run']['head_sha'] == verification_commit
          assert artifact['digest'] == 'sha256:' + expected['sha256']
          with Path('.build/dfm-hotfix-input.zip').open('wb') as output:
              subprocess.run(['gh', 'api', 'repos/' + repository + '/actions/artifacts/' + str(expected['artifact_id']) + '/zip'], stdout=output, check=True)
          import hashlib
          with Path('.build/dfm-hotfix-input.zip').open('rb') as source:
              assert hashlib.file_digest(source, 'sha256').hexdigest() == expected['sha256']
          print('Verified complete DFM RPM provenance, successful validation and exact artifact archive.')
          PY

      - name: Build RPMs and compose the Live ISO
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            --env FEDORA_DDE_ISO_BUILD=1 \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/.build/installer:/installer:ro" \
            --volume "$GITHUB_WORKSPACE/.build/installer-rpms:/installer-rpms:ro" \
            --volume "$GITHUB_WORKSPACE/.build/dfm-hotfix-input.zip:/dfm-hotfix-input.zip:ro" \
            --volume "$RUNNER_TEMP/fedora-dde-iso-work:/work" \
            --volume "$GITHUB_WORKSPACE/artifacts:/output" \
            registry.fedoraproject.org/fedora:45 \
            bash -c 'set -o pipefail; bash /workspace/scripts/build.sh 2>&1 | tee /output/logs/build.log'

      - name: Preserve diagnostics and make build outputs readable
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs
          sudo dmesg --ctime | grep -Ei 'out of memory|oom|killed process' > artifacts/logs/host-oom.log || true
          free -h > artifacts/logs/host-memory.txt
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE" > artifacts/logs/host-filesystems.txt
          sudo chown -R --no-dereference "$(id -u):$(id -g)" artifacts
          chmod -R u+rwX artifacts

      - name: Upload ISO and checksums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.recipe.outputs.iso_artifact }}
          path: |
            artifacts/*.iso
            artifacts/*CHECKSUM*
            artifacts/build-info.json
            artifacts/comps-input.json
            artifacts/container-image.json
            artifacts/rpm-manifest.txt
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

      - name: Upload build logs and RPM inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ISO-build-logs-and-RPMs-${{ github.run_number }}
          path: |
            artifacts/logs/
            artifacts/rpms/
            artifacts/*.txt
            artifacts/*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Fedora 45 DDE Remix ISO'
            echo
            echo '- Architecture: x86_64'
            echo '- SELinux: Enforcing in the Live image and installed system'
            echo '- PAM: native Fedora configuration supplied by the maintainer DDM package'
            echo '- Live login: `liveuser` / `liveuser` (manual login)'
            echo '- Desktop: maintainer comps RPM, then `dnf group install dde-desktop`'
            echo '- Installer revision: `${{ steps.recipe.outputs.installer_ref }}`'
            echo '- Release verification: the following VM job must pass a real installation and disk boot'
            echo
            if compgen -G 'artifacts/*.iso' > /dev/null; then
              echo '### ISO files'
              ls -lh artifacts/*.iso
            else
              echo 'No ISO was produced. Inspect the build logs for the failed stage.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  canary:
    name: Check desktop and encrypted small-disk installation
    needs: compose
    uses: ./.github/workflows/test-install.yml
    with:
      iso-run-id: ${{ github.run_id }}
      iso-artifact-name: ${{ needs.compose.outputs.iso-artifact }}
      scenario: uefi-luks-btrfs-small

  installation:
    name: Test the remaining partition combinations
    needs: [compose, canary]
    uses: ./.github/workflows/test-install.yml
    with:
      iso-run-id: ${{ github.run_id }}
      iso-artifact-name: ${{ needs.compose.outputs.iso-artifact }}
      scenario: remaining

