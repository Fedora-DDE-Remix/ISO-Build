name: Test ISO installation

on:
  push:
    branches: [validate-iso3-20261127]
    paths:
      - '.github/workflows/test-install.yml'
      - 'scripts/test-install-vm.py'
      - 'scripts/test-vm-login.py'
      - 'scripts/vm-*'
  workflow_call:
    inputs:
      iso-run-id:
        description: Build workflow run containing the ISO artifact
        required: true
        type: string
      iso-artifact-name:
        description: Exact ISO artifact name from the compose job
        required: true
        type: string
      scenario:
        description: One scenario, all scenarios, or remaining scenarios after the encrypted small-disk canary
        required: false
        default: all
        type: string
      continue-after-desktop-failure:
        description: Collect disk diagnostics after a desktop failure; overall result still fails
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      iso-run-id:
        description: Completed ISO build run ID
        required: true
        type: string
      iso-artifact-name:
        description: Exact ISO artifact name from that run
        required: true
        type: string
      scenario:
        description: Partition scenario to verify
        required: true
        default: all
        type: choice
        options:
          - all
          - uefi-small
          - uefi-btrfs
          - bios-ext4
          - bios-mbr-ext4
          - uefi-xfs-home-swap
          - uefi-preserve
          - uefi-luks-btrfs-small
          - bios-luks-ext4
          - uefi-luks-xfs
      continue-after-desktop-failure:
        description: Collect disk diagnostics after a desktop failure (still fails overall)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  matrix:
    name: Select partition scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scenarios: ${{ steps.select.outputs.scenarios }}
      iso_run_id: ${{ steps.select.outputs.iso_run_id }}
      iso_artifact_name: ${{ steps.select.outputs.iso_artifact_name }}
      iso_commit: ${{ steps.select.outputs.iso_commit }}
      iso_sha256: ${{ steps.select.outputs.iso_sha256 }}
    steps:
      - name: Check out the test inputs
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate requested scenarios
        id: select
        env:
          TEST_EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SCENARIO: ${{ inputs.scenario }}
          REQUESTED_ISO_RUN_ID: ${{ inputs.iso-run-id }}
          REQUESTED_ISO_ARTIFACT: ${{ inputs.iso-artifact-name }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          scenarios = ['uefi-btrfs', 'bios-ext4', 'bios-mbr-ext4',
                       'uefi-xfs-home-swap', 'uefi-preserve', 'uefi-small',
                       'uefi-luks-btrfs-small', 'bios-luks-ext4', 'uefi-luks-xfs']
          expected_commit = expected_sha256 = ''
          run_id = os.environ['REQUESTED_ISO_RUN_ID']
          artifact = os.environ['REQUESTED_ISO_ARTIFACT']
          # Reusable workflows retain their caller's event context. A normal
          # compose -> workflow_call from a push must use its explicit inputs.
          if run_id or artifact:
              if not run_id or not artifact:
                  raise SystemExit('Both the ISO run ID and artifact name are required.')
              requested = os.environ['REQUESTED_SCENARIO'] or 'all'
          elif os.environ['TEST_EVENT_NAME'] == 'push':
              if os.environ['GITHUB_REF'] != 'refs/heads/validate-iso3-20261127':
                  raise SystemExit('Pinned ISO retests are restricted to the dedicated validation branch.')
              pinned = json.loads(Path('scripts/vm-retest.json').read_text())
              if (type(pinned.get('schema')) is not int or pinned['schema'] != 1
                      or pinned.get('repository') != 'Fedora-DDE-Remix/ISO-Build'
                      or type(pinned.get('iso_run_id')) is not int):
                  raise SystemExit('Invalid pinned ISO retest identity.')
              run_id = str(pinned['iso_run_id'])
              artifact = pinned['iso_artifact_name']
              requested = pinned['scenario']
              expected_commit = pinned['iso_commit']
              expected_sha256 = pinned['iso_sha256']
              if (not re.fullmatch(r'[0-9a-f]{40}', expected_commit)
                      or not re.fullmatch(r'[0-9a-f]{64}', expected_sha256)):
                  raise SystemExit('The pinned ISO commit and raw SHA-256 are required.')
          else:
              raise SystemExit('Explicit ISO inputs are required outside the pinned push retest.')
          if not re.fullmatch(r'[1-9][0-9]*', run_id):
              raise SystemExit('Invalid ISO build run ID.')
          if not re.fullmatch(r'Fedora-DDE-Remix-[A-Za-z0-9._-]+', artifact):
              raise SystemExit('Invalid ISO artifact name.')
          if requested not in ['all', 'remaining', *scenarios]:
              raise SystemExit('Unknown partition scenario: ' + requested)
          selected = (scenarios if requested == 'all' else
                      [name for name in scenarios if name != 'uefi-luks-btrfs-small']
                      if requested == 'remaining' else [requested])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('scenarios=' + json.dumps(selected) + '\n')
              output.write('iso_run_id=' + run_id + '\n')
              output.write('iso_artifact_name=' + artifact + '\n')
              output.write('iso_commit=' + expected_commit + '\n')
              output.write('iso_sha256=' + expected_sha256 + '\n')
          PY

  install:
    name: ${{ matrix.scenario }} installation with SELinux Enforcing
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        scenario: ${{ fromJSON(needs.matrix.outputs.scenarios) }}
    steps:
      - name: Check out the test controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify the controller with a real sudo shell
        run: python3 scripts/vm-shell-smoke.py

      - name: Install the VM host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf xorriso tesseract-ocr python3-pil acl
          mkdir -p artifacts/vm "$RUNNER_TEMP/fedora-dde-install-vm"
          df -h "$RUNNER_TEMP" > artifacts/vm/host-filesystems.txt
          free -h > artifacts/vm/host-memory.txt
          qemu-system-x86_64 --version > artifacts/vm/qemu-version.txt
          # The virtual disk is sparse, but its installed payload still needs
          # real host space in addition to the downloaded compressed ISO.
          available=$(df --output=avail -B1 "$RUNNER_TEMP" | tail -n 1)
          if (( available < 32212254720 )); then
            # These unused, preinstalled toolchains belong to this disposable
            # GitHub runner. No repository or user files are removed.
            sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
            available=$(df --output=avail -B1 "$RUNNER_TEMP" | tail -n 1)
          fi
          if (( available < 32212254720 )); then
            echo 'At least 30 GiB free host space is required before downloading the ISO.' >&2
            exit 1
          fi

      - name: Prepare unprivileged KVM group access
        id: kvm_access
        shell: bash
        run: |
          set -euo pipefail
          {
            runner_uid=$(id -u)
            runner_gid=$(id -g)
            runner_name=$(id -un)
            if (( runner_uid == 0 )); then
              echo 'The VM controller must run as the existing non-root runner.' >&2
              exit 1
            fi
            kvm_gid=-1
            if [[ -e /dev/kvm || -L /dev/kvm ]]; then
              if [[ ! -c /dev/kvm ]]; then
                echo '/dev/kvm exists but is not a character device; refusing authorization.' >&2
                exit 1
              fi
              kvm_record=$(getent group kvm) || {
                echo 'The existing KVM device has no resolvable kvm group.' >&2
                exit 1
              }
              IFS=: read -r kvm_name unused kvm_gid unused <<< "$kvm_record"
              if [[ "$kvm_name" != kvm || ! "$kvm_gid" =~ ^[1-9][0-9]*$ ]] || \
                 [[ "$(stat -c %g /dev/kvm)" != "$kvm_gid" ]]; then
                echo '/dev/kvm is not owned by the resolved kvm group; refusing authorization.' >&2
                exit 1
              fi
              # uaccess may replace named-user ACLs when a KVM VM exits.
              # Keep the native device permissions and use its owning group.
              sudo --non-interactive /usr/sbin/usermod --append --groups kvm -- "$runner_name"
              id "$runner_name"
            else
              echo '/dev/kvm is absent; the controller may use its ordinary TCG fallback.'
            fi
            printf 'uid=%s\ngid=%s\nkvm_gid=%s\n' "$runner_uid" "$runner_gid" "$kvm_gid" >> "$GITHUB_OUTPUT"
            printf 'Expected controller UID=%s GID=%s KVM_GID=%s\n' "$runner_uid" "$runner_gid" "$kvm_gid"
          } 2>&1 | tee artifacts/vm/host-kvm-authorization.log

      - name: Check VM controller and read-only diagnostic regressions
        run: |
          /usr/bin/python3 scripts/test-vm-login.py
          /usr/bin/python3 scripts/vm-session-probe-test.py
          /usr/bin/python3 scripts/vm-controller-regression.py
          /usr/bin/python3 scripts/vm-storage-probe-test.py

      - name: Download the exact compose artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.matrix.outputs.iso_artifact_name }}
          run-id: ${{ needs.matrix.outputs.iso_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/iso

      - name: Verify the ISO checksum and record its source
        shell: bash
        env:
          ISO_RUN_ID: ${{ needs.matrix.outputs.iso_run_id }}
          ISO_ARTIFACT_NAME: ${{ needs.matrix.outputs.iso_artifact_name }}
          EXPECTED_ISO_COMMIT: ${{ needs.matrix.outputs.iso_commit }}
          EXPECTED_ISO_SHA256: ${{ needs.matrix.outputs.iso_sha256 }}
        run: |
          set -euo pipefail
          (cd artifacts/iso && sha256sum --check --strict CHECKSUM)
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          origin = {'schema': 1, 'iso_run_id': os.environ['ISO_RUN_ID'],
                    'iso_artifact_name': os.environ['ISO_ARTIFACT_NAME'],
                    'test_commit': os.environ['GITHUB_SHA'],
                    'test_run_id': os.environ['GITHUB_RUN_ID']}
          info = json.loads(Path('artifacts/iso/build-info.json').read_text())
          if info.get('selinux') != 'enforcing' or info.get('pam') != 'fedora':
              raise SystemExit('The VM gate requires the release Enforcing/Fedora PAM image.')
          expected_commit = os.environ['EXPECTED_ISO_COMMIT']
          expected_sha256 = os.environ['EXPECTED_ISO_SHA256']
          if expected_commit or expected_sha256:
              if not expected_commit or not expected_sha256 or info.get('iso_commit') != expected_commit:
                  raise SystemExit('The retest artifact does not match the pinned ISO source commit.')
              images = list(Path('artifacts/iso').glob('*.iso'))
              if len(images) != 1:
                  raise SystemExit('The retest requires exactly one ISO.')
              with images[0].open('rb') as source:
                  actual_sha256 = hashlib.file_digest(source, 'sha256').hexdigest()
              if actual_sha256 != expected_sha256:
                  raise SystemExit('The retest ISO bytes differ from the pinned compose output.')
              origin.update(pinned_iso_commit=expected_commit, pinned_iso_sha256=expected_sha256,
                            pinned_iso_identity_verified=True)
          Path('artifacts/vm/artifact-origin.json').write_text(json.dumps(origin, indent=2) + '\n')
          PY
          cp artifacts/iso/CHECKSUM artifacts/iso/build-info.json artifacts/vm/

      - name: Boot, install, configure, and boot the installed disk
        shell: bash
        env:
          TEST_SCENARIO: ${{ matrix.scenario }}
          CONTINUE_AFTER_DESKTOP_FAILURE: ${{ inputs.continue-after-desktop-failure }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(artifacts/iso/*.iso)
          (( ${#images[@]} == 1 ))
          diagnostic_options=()
          if [[ "$CONTINUE_AFTER_DESKTOP_FAILURE" == true ]]; then
            diagnostic_options+=(--continue-after-desktop-failure)
          fi
          runner_uid='${{ steps.kvm_access.outputs.uid }}'
          runner_gid='${{ steps.kvm_access.outputs.gid }}'
          kvm_gid='${{ steps.kvm_access.outputs.kvm_gid }}'
          [[ "$(id -u)" == "$runner_uid" && "$(id -g)" == "$runner_gid" ]]
          # sudo initializes the target user's supplementary groups. Keep the
          # original UID, primary GID, working directory and controller argv.
          sudo --non-interactive --user="#$runner_uid" --group="#$runner_gid" -- \
            /usr/bin/python3 - "$runner_uid" "$runner_gid" "$kvm_gid" "$PWD" \
            /usr/bin/python3 scripts/test-install-vm.py \
            --iso "${images[0]}" \
            --work-dir "$RUNNER_TEMP/fedora-dde-install-vm" \
            --output-dir artifacts/vm/test --timeout 5400 \
            --scenario "$TEST_SCENARIO" \
            "${diagnostic_options[@]}" \
            <<'PY' 2>&1 | tee artifacts/vm/controller.log
          import json, os, stat, sys
          from pathlib import Path
          uid, gid, kvm_gid = map(int, sys.argv[1:4])
          expected_cwd = sys.argv[4]
          evidence = {'uid': os.getuid(), 'euid': os.geteuid(),
                      'gid': os.getgid(), 'egid': os.getegid(),
                      'groups': os.getgroups(), 'cwd': os.getcwd(),
                      'expected_uid': uid, 'expected_gid': gid, 'expected_kvm_gid': kvm_gid}
          try:
              if uid == 0 or (os.getuid(), os.geteuid(), os.getgid(), os.getegid()) != (uid, uid, gid, gid):
                  raise RuntimeError('sudo changed the non-root controller identity.')
              if os.getcwd() != expected_cwd:
                  raise RuntimeError('sudo changed the controller working directory.')
              if kvm_gid >= 0:
                  node = os.stat('/dev/kvm')
                  if not stat.S_ISCHR(node.st_mode) or node.st_gid != kvm_gid:
                      raise RuntimeError('The authorized KVM device type or group changed.')
                  if kvm_gid not in {os.getgid(), *os.getgroups()}:
                      raise RuntimeError('sudo did not initialize the required KVM supplementary group.')
                  descriptor = os.open('/dev/kvm', os.O_RDWR | os.O_CLOEXEC)
                  os.close(descriptor)
                  evidence['kvm_open'] = True
              elif os.path.lexists('/dev/kvm'):
                  raise RuntimeError('A KVM device appeared after host authorization; rerun host setup.')
              else:
                  evidence['kvm_absent_tcg_allowed'] = True
              evidence['status'] = 'verified'
          except (OSError, RuntimeError) as error:
              evidence.update(status='failed', error=str(error))
              raise
          finally:
              path = Path(expected_cwd) / 'artifacts/vm/host-kvm-controller.json'
              path.write_text(json.dumps(evidence, indent=2) + '\n')
              print('VM host authorization: ' + json.dumps(evidence), flush=True)
          os.execv(sys.argv[5], sys.argv[5:])
          PY

      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ISO-installation-evidence-${{ matrix.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/vm/
          retention-days: 90
          if-no-files-found: error

      - name: Write installation summary
        if: always()
        shell: bash
        env:
          TEST_RESULT: ${{ job.status }}
          TEST_SCENARIO: ${{ matrix.scenario }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          lines = ['## ISO installation verification: ' + os.environ['TEST_SCENARIO'], '',
                   'Result: **' + os.environ['TEST_RESULT'] + '**', '',
                   'The test boots the ISO with the selected firmware, installs into a disposable virtual disk,',
                   'configures a user in the same Live session, and boots that disk without the ISO.',
                   'SELinux must remain Enforcing and a real DDM desktop session must succeed.', '']
          report = Path('artifacts/vm/test/report.json')
          if report.is_file():
              lines += ['```json', json.dumps(json.loads(report.read_text()), indent=2), '```']
          else:
              lines += ['No completed VM report was produced; inspect the installation evidence artifact.']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n'.join(lines) + '\n')
          PY
